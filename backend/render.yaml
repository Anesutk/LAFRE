services:
  - type: web
    name: lafre-backend
    env: python
    plan: free
    buildCommand: ./build.sh
    startCommand: ./start.sh
    healthCheckPath: /health/
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.11
      - key: DJANGO_DEBUG
        value: "0"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: BEDROCK_ROUTER_MODEL_ID
        sync: false
      - key: FRONTEND_BASE_URL
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: DJANGO_CSRF_TRUSTED_ORIGINS
        sync: false
      - key: AWS_REGION
        sync: false
      - key: AWS_KB_ID
        sync: false
      - key: AWS_BEDROCK_MODEL_ID
        sync: false
      - key: BEDROCK_FAST_MODEL_ID
        sync: false
      - key: BEDROCK_SMART_MODEL_ID
        sync: false
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
# No `databases:` block anymore - this project now uses an external Supabase Postgres
# instance instead of Render's own Postgres. DATABASE_URL above is `sync: false`, meaning
# Render will NEVER auto-populate or overwrite it on a Blueprint sync - it only reads
# whatever value you set by hand in the Render dashboard (Environment tab). Set it there to
# your Supabase pooled (6543) connection string once, and it will not be touched again by
# deploys from this file.
